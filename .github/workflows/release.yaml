name: Release
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

# Every C build uses zig (scripts/zcc): libeuicc for each target, and cgo.
# Linux and Windows are cross-compiled on one Ubuntu runner. macOS builds
# need the macOS SDK (the PCSC, CoreFoundation and Security frameworks and
# libresolv, which zig does not ship, and which Apple licenses for Apple
# hardware only), so they run on a macOS runner, still compiled by zig,
# one package per architecture.
# The eUICC data embedded is the one committed in internal/registry/data;
# CI never downloads it (scripts/update-euicc-data.sh is run by hand).
# CMake comes with the runner images (/usr/local/bin on Ubuntu, Homebrew
# on macOS); apt only adds the PC/SC headers.
env:
  ZIG_VERSION: 0.17.1
  CGO_ENABLED: '1'

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # third_party/lpac
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev
      - name: Build libeuicc (linux/amd64)
        run: ./scripts/build-libeuicc.sh linux/amd64
      - name: Test
        env:
          CC: ${{ github.workspace }}/scripts/zcc
          # libpcsclite comes from the runner, built against a newer glibc
          # than the 2.31 the binaries target.
          CGO_LDFLAGS: -L/usr/lib/x86_64-linux-gnu -Wl,--allow-shlib-undefined
        run: |
          go vet ./...
          go test -race ./...
          go test -race -tags demo ./cmd/...

  build-linux-windows:
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # third_party/lpac
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev
      - name: Build libeuicc
        run: |
          ./scripts/build-libeuicc.sh linux/amd64
          ./scripts/build-libeuicc.sh windows/amd64
      - name: Build Linux (amd64)
        env:
          CC: ${{ github.workspace }}/scripts/zcc
          CGO_LDFLAGS: -L/usr/lib/x86_64-linux-gnu -Wl,--allow-shlib-undefined
        run: go run github.com/egoist/mygo/cmd/mygo@v0.8.3 build -platform linux/amd64
      # Windows ships the single executable, without the NSIS installer:
      # it needs no files beside it, and libeuicc is linked in statically.
      - name: Build Windows (amd64)
        env:
          CC: ${{ github.workspace }}/scripts/zcc
        run: |
          go run github.com/egoist/mygo/cmd/mygo@v0.8.3 build -platform windows/amd64 -skip-installer
          VERSION=$(jq -r .version mygo.json)
          mv build/windows-amd64/EasyLPAC.exe "build/windows-amd64/easylpac-$VERSION-windows-amd64.exe"
      - name: Collect licenses and source
        run: ./scripts/collect-licenses.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: easylpac-linux-windows
          path: |
            build/linux-amd64/*.tar.gz
            build/linux-amd64/*.deb
            build/windows-amd64/easylpac-*-windows-amd64.exe
            dist/*

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # third_party/lpac
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build libeuicc
        run: |
          ./scripts/build-libeuicc.sh darwin/arm64
          ./scripts/build-libeuicc.sh darwin/amd64
      # One package per architecture (x86_64 cross-compiled on this arm64
      # runner): easylpac-<version>-arm64.dmg and easylpac-<version>-amd64.dmg.
      - name: Build macOS (arm64, amd64)
        env:
          CC: ${{ github.workspace }}/scripts/zcc
        run: go run github.com/egoist/mygo/cmd/mygo@v0.8.3 build -platform darwin/arm64,darwin/amd64
      - uses: actions/upload-artifact@v7
        with:
          name: easylpac-macos
          path: |
            build/darwin-arm64/*.dmg
            build/darwin-amd64/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # The release files go flat into release/, as their assets are named
      # by file name. SHA256SUMS ships with them (sha256sum -c
      # --ignore-missing SHA256SUMS checks a download), and its lines go in
      # the notes.
      - name: Checksums
        run: |
          mkdir release
          find artifacts -type f -exec mv -t release {} +
          cd release
          ls | LC_ALL=C sort | xargs -d '\n' sha256sum > SHA256SUMS
          {
            echo '## SHA-256'
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > ../notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: notes.md
          generate_release_notes: true
