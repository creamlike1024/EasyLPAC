name: Build
# Every push to master or a release/ branch, and every pull request, is
# tested and built: the packages are the run's artifacts, with a snapshot
# version (0.9.2.r12.ga4e79e0). A pushed release tag (v0.9.3,
# v0.10.0-rc.1) builds the same way, with the tag without its "v" as the
# version, and publishes the GitHub Release; a pre-release tag makes a
# pre-release. Tags begin with "v" as mygo's updater expects (tagPrefix).
on:
  push:
    branches:
      - master
      - 'release/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run;
# tag builds always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Every C build uses zig (scripts/zcc): libeuicc for each target, and cgo.
# Linux amd64 and Windows are cross-compiled on one Ubuntu runner, Linux
# arm64 is built on an arm64 Ubuntu runner. macOS builds
# need the macOS SDK (the PCSC, CoreFoundation and Security frameworks and
# libresolv, which zig does not ship, and which Apple licenses for Apple
# hardware only), so they run on a macOS runner, still compiled by zig,
# one package per architecture.
# The eUICC data embedded is the one committed in internal/registry/data;
# CI never downloads it (scripts/update-euicc-data.sh is run by hand).
# CMake comes with the runner images (/usr/local/bin on Ubuntu, Homebrew
# on macOS); apt only adds the PC/SC headers.
# The version is computed once, by scripts/version.sh in the test job, and
# given to the builds as EASYLPAC_VERSION; scripts/with-version.sh puts it
# in mygo.json for mygo build (the committed one says 0.0.0-dev).
env:
  ZIG_VERSION: 0.17.1
  CGO_ENABLED: '1'

jobs:
  test:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # third_party/lpac and third_party/go-ccid
          fetch-depth: 0 # the tags and history scripts/version.sh reads
      # A release tag, without its "v", is the version, checked for the
      # form x.y.z[-pre] by scripts/version.sh; anything else is a snapshot
      # of the git history.
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION=$(EASYLPAC_VERSION="$GITHUB_REF_NAME" ./scripts/version.sh)
          else
            VERSION=$(./scripts/version.sh)
          fi
          echo "version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev
      - name: Build libeuicc (linux/amd64)
        run: ./scripts/build-libeuicc.sh linux/amd64
      - name: Test
        env:
          CC: ${{ github.workspace }}/scripts/zcc
          # libpcsclite comes from the runner, built against a newer glibc
          # than the 2.31 the binaries target.
          CGO_LDFLAGS: -L/usr/lib/x86_64-linux-gnu -Wl,--allow-shlib-undefined
        run: |
          go vet ./...
          go test -race ./...
          go test -race -tags demo ./cmd/...
          go test -race -tags phone ./cmd/...

  build-linux-windows:
    needs: test
    runs-on: ubuntu-26.04
    env:
      EASYLPAC_VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # third_party/lpac and third_party/go-ccid
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev
      - name: Build libeuicc
        run: |
          ./scripts/build-libeuicc.sh linux/amd64
          ./scripts/build-libeuicc.sh windows/amd64
      # A .deb, an .rpm, a PKGBUILD (with the icons it installs, beside the
      # archive it packages) and the archive with install.sh. The PKGBUILD
      # ships as PKGBUILD-x86_64, beside arm64's PKGBUILD-aarch64
      # (makepkg -si -p PKGBUILD-x86_64).
      - name: Build Linux (amd64)
        env:
          CC: ${{ github.workspace }}/scripts/zcc
          CGO_LDFLAGS: -L/usr/lib/x86_64-linux-gnu -Wl,--allow-shlib-undefined
        run: |
          ./scripts/with-version.sh go run github.com/egoist/mygo/cmd/mygo@v0.10.0 build -platform linux/amd64
          mv build/linux-amd64/PKGBUILD build/linux-amd64/PKGBUILD-x86_64
      # Windows ships the single executable, without the NSIS installer:
      # it needs no files beside it, and libeuicc is linked in statically.
      # mygo_nowebview leaves WebView2 out: every window is native UI, so
      # the app needs no WebView2 Runtime.
      - name: Build Windows (amd64)
        env:
          CC: ${{ github.workspace }}/scripts/zcc
          GOFLAGS: -tags=mygo_nowebview
        run: |
          ./scripts/with-version.sh go run github.com/egoist/mygo/cmd/mygo@v0.10.0 build -platform windows/amd64 -skip-installer
          mv build/windows-amd64/EasyLPAC.exe "build/windows-amd64/easylpac-$EASYLPAC_VERSION-windows-amd64.exe"
      - name: Collect licenses and source
        run: ./scripts/collect-licenses.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: easylpac-${{ env.EASYLPAC_VERSION }}-linux-windows
          path: |
            build/linux-amd64/*.tar.gz
            build/linux-amd64/*.deb
            build/linux-amd64/*.rpm
            build/linux-amd64/PKGBUILD-x86_64
            build/linux-amd64/easylpac-256x256.png
            build/linux-amd64/easylpac-512x512.png
            build/windows-amd64/easylpac-*-windows-amd64.exe
            dist/*

  # Linux arm64 (#51) builds natively on GitHub's arm64 runner, free for
  # public repositories: cgo links the runner's arm64 libpcsclite, which
  # the x64 runner would only have through a multiarch apt setup. The
  # tests run again here, on arm64. Its PKGBUILD ships as
  # PKGBUILD-aarch64 (makepkg -si -p PKGBUILD-aarch64), beside amd64's
  # PKGBUILD-x86_64 in the flat release. Its icons are left out: they are the
  # amd64 job's, byte for byte, under the same names (the release checks
  # each PKGBUILD's checksums against the files it ships).
  build-linux-arm64:
    needs: test
    runs-on: ubuntu-26.04-arm
    env:
      EASYLPAC_VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # third_party/lpac and third_party/go-ccid
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpcsclite-dev
      - name: Build libeuicc (linux/arm64)
        run: ./scripts/build-libeuicc.sh linux/arm64
      - name: Test
        env:
          CC: ${{ github.workspace }}/scripts/zcc
          CGO_LDFLAGS: -L/usr/lib/aarch64-linux-gnu -Wl,--allow-shlib-undefined
        run: go test ./...
      - name: Build Linux (arm64)
        env:
          CC: ${{ github.workspace }}/scripts/zcc
          CGO_LDFLAGS: -L/usr/lib/aarch64-linux-gnu -Wl,--allow-shlib-undefined
        run: |
          ./scripts/with-version.sh go run github.com/egoist/mygo/cmd/mygo@v0.10.0 build -platform linux/arm64
          mv build/linux-arm64/PKGBUILD build/linux-arm64/PKGBUILD-aarch64
      - uses: actions/upload-artifact@v7
        with:
          name: easylpac-${{ env.EASYLPAC_VERSION }}-linux-arm64
          path: |
            build/linux-arm64/*.tar.gz
            build/linux-arm64/*.deb
            build/linux-arm64/*.rpm
            build/linux-arm64/PKGBUILD-aarch64

  build-macos:
    needs: test
    runs-on: macos-latest
    env:
      EASYLPAC_VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # third_party/lpac and third_party/go-ccid
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build libeuicc
        run: |
          ./scripts/build-libeuicc.sh darwin/arm64
          ./scripts/build-libeuicc.sh darwin/amd64
      # One package per architecture (x86_64 cross-compiled on this arm64
      # runner): easylpac-<version>-arm64.dmg and easylpac-<version>-amd64.dmg.
      - name: Build macOS (arm64, amd64)
        env:
          CC: ${{ github.workspace }}/scripts/zcc
        run: ./scripts/with-version.sh go run github.com/egoist/mygo/cmd/mygo@v0.10.0 build -platform darwin/arm64,darwin/amd64
      - uses: actions/upload-artifact@v7
        with:
          name: easylpac-${{ env.EASYLPAC_VERSION }}-macos
          path: |
            build/darwin-arm64/*.dmg
            build/darwin-amd64/*.dmg

  # The APK, arm64. libeuicc is built with the NDK, the app with mygo and
  # Gradle on JDK 17 (Gradle 8.14 runs on Java 24 at most). Tag builds
  # alone run in the environment "release", whose secrets hold the release
  # key: ANDROID_KEYSTORE_BASE64 (the keystore, in base64),
  # ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD and, if it differs,
  # ANDROID_KEY_PASSWORD. The environment lets only v* tags in, so pushes
  # and pull requests never see the key: their APKs are signed with a
  # debug key of the runner's, which no other build's updates. A tag
  # without the key fails rather than release a debug-signed APK.
  build-android:
    needs: test
    runs-on: ubuntu-26.04
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    env:
      EASYLPAC_VERSION: ${{ needs.test.outputs.version }}
      ANDROID_NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # third_party/lpac and third_party/go-ccid
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0" "ndk;$ANDROID_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::No ANDROID_KEYSTORE_BASE64 secret in the environment release: a tag's APK needs the release key"
              exit 1
            fi
            echo "::notice::Not a tag: the APK is signed with a debug key"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "EASYLPAC_ANDROID_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "EASYLPAC_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Build Android (arm64)
        env:
          MYGO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYGO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./scripts/build-android.sh
          mv build/android/*.apk "build/android/easylpac-$EASYLPAC_VERSION-android-arm64.apk"
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: easylpac-${{ env.EASYLPAC_VERSION }}-android
          path: build/android/easylpac-*-android-arm64.apk

  release:
    if: github.ref_type == 'tag'
    needs: [build-linux-windows, build-linux-arm64, build-macos, build-android]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # The release files go flat into release/, as their assets are named
      # by file name. SHA256SUMS ships with them (sha256sum -c
      # --ignore-missing SHA256SUMS checks a download), and its lines go in
      # the notes.
      - name: Checksums
        run: |
          mkdir release
          find artifacts -type f -exec mv -t release {} +
          cd release
          ls | LC_ALL=C sort | xargs -d '\n' sha256sum > SHA256SUMS
          {
            echo '## SHA-256'
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > ../notes.md
      # The PKGBUILDs (amd64's and arm64's) share the icons, which the
      # amd64 job's artifact supplies: every source of each must be in
      # the release, with the checksum the PKGBUILD gives.
      - name: Check the PKGBUILDs' sources
        run: |
          cd release
          for p in PKGBUILD-x86_64 PKGBUILD-aarch64; do
            if ! (. "./$p" && for i in "${!source[@]}"; do echo "${sha256sums[i]}  ${source[i]}"; done) | sha256sum -c --quiet; then
              echo "::error::$p: its sources are not the release's files"
              exit 1
            fi
          done
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
